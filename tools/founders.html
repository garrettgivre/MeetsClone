<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Founder Sprites</title>
<style>
  body { margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; background: #f4f1ea; color: #262459; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 18px; }
  figure { margin: 0; text-align: center; font-size: 12px; }
  canvas { image-rendering: pixelated; background: #e9f6fb; border-radius: 10px; }
</style>
</head>
<body>
<h1>Founder Sprites (hand-pixelled)</h1>
<div id="out"></div>
<script type="module">
import { PACKED } from '../src/engine/palette.js';
import { lut } from '../src/engine/sprite.js';
import { FOUNDER_ART } from '../src/art/founders.js';
import { composePet } from '../src/game/render.js';
import { FOUNDERS, pureGenome, express } from '../src/game/genetics.js';

const out = document.getElementById('out');
function spriteCanvas(spr, scale) {
  const c = document.createElement('canvas');
  c.width = spr.w; c.height = spr.h;
  c.style.width = spr.w * scale + 'px'; c.style.height = spr.h * scale + 'px';
  const ctx = c.getContext('2d'); const img = ctx.createImageData(spr.w, spr.h); const u = new Uint32Array(img.data.buffer);
  const t = lut(spr); const f = spr.frames[0];
  for (let i = 0; i < f.length; i++) { const p = t[f[i]]; if (p) u[i] = PACKED[p]; }
  ctx.putImageData(img, 0, 0);
  return c;
}
function bitmapCanvas(bm, scale) {
  const c = document.createElement('canvas'); c.width = bm.w; c.height = bm.h;
  c.style.width = bm.w * scale + 'px'; c.style.height = bm.h * scale + 'px';
  const ctx = c.getContext('2d'); const img = ctx.createImageData(bm.w, bm.h); const u = new Uint32Array(img.data.buffer);
  for (let i = 0; i < bm.px.length; i++) if (bm.px[i]) u[i] = PACKED[bm.px[i]];
  ctx.putImageData(img, 0, 0);
  return c;
}
const fig = (el, label) => { const f = document.createElement('figure'); f.append(el, document.createElement('br'), label); return f; };
for (const [name, art] of Object.entries(FOUNDER_ART)) {
  const row = document.createElement('div'); row.className = 'row';
  const f = FOUNDERS.find(x => x.name === name);
  row.append(fig(spriteCanvas(art.spr, 8), name + ' (new, 8x)'));
  row.append(fig(spriteCanvas(art.spr, 3), 'new, game size'));
  if (f) row.append(fig(bitmapCanvas(composePet(express(pureGenome(f.traits)), 'adult', {}), 1.5), 'old generated'));
  out.append(row);
  // expression and animation sheet, as the game draws it
  const sheet = document.createElement('div'); sheet.className = 'row';
  const p = f ? express(pureGenome(f.traits)) : null;
  for (const [label, pose] of [['idle', {}], ['breathe', { bob: 1 }], ['hop', { step: 1 }], ['blink', { expr: 'blink' }], ['happy', { expr: 'happy' }],
    ['wink', { expr: 'wink' }], ['eat', { expr: 'eat' }], ['sad', { expr: 'sad' }], ['sleep', { expr: 'sleep' }], ['dizzy', { expr: 'dizzy' }],
    ['cap + glasses', { wear: { head: 'cap', face: 'glasses', body: 'bowtie' } }]]) {
    sheet.append(fig(bitmapCanvas(composePet(p, 'adult', { species: name, ...pose }), 1.5), label));
  }
  out.append(sheet);
}
</script>
</body>
</html>
