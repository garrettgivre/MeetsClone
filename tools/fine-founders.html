<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fine-line pets</title>
<style>
  body { margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; background: #f4f1ea; color: #262459; }
  h2 { font-size: 15px; margin: 18px 0 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  figure { margin: 0 0 8px; text-align: center; font-size: 12px; }
  canvas { image-rendering: pixelated; border-radius: 6px; display: block; }
</style>
</head>
<body>
<p>Not in the game yet. Fine-line pets put together from the parts in <code>src/art/pets/fine/</code>.
<code>?z=3</code> zoom, <code>?room=garden</code> room, <code>?only=fox,owl</code> some founders, <code>?show=founders|forms|swaps|mixes</code> one section, <code>?seed=7</code> other mixes.</p>
<div id="out"></div>
<script type="module">
import { PACKED, C } from '../src/engine/palette.js';
import { makeRng } from '../src/engine/rng.js';
import { homeRoom, RW, HOME_FEET } from '../src/art/town.js';
import { LINES, FORMS, PARTS, founder, compose, drawable } from './fine-compose.js';

const q = new URLSearchParams(location.search);
const z = +(q.get('z') || 2);
const out = document.getElementById('out');
const names = (q.get('only') || Object.keys(LINES).join(',')).split(',').filter(n => LINES[n]);
const show = q.get('show');

let row = out;
function section(title) {
  const h = document.createElement('h2'); h.textContent = title; out.append(h);
  row = document.createElement('div'); row.className = 'row'; out.append(row);
}
function sheet(w, h, zoom, paint, label) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  cv.style.width = w * zoom + 'px'; cv.style.height = h * zoom + 'px';
  const ctx = cv.getContext('2d'), img = ctx.createImageData(w, h), u = new Uint32Array(img.data.buffer);
  u.fill(PACKED[C('sky.3')]);
  paint((x, y, c) => { if (c && x >= 0 && y >= 0 && x < w && y < h) u[y * w + x] = PACKED[c]; });
  ctx.putImageData(img, 0, 0);
  const f = document.createElement('figure'); f.append(cv, label); row.append(f);
}
/** One pet by itself on a plain card, standing on a line near the bottom. */
function card(p, label, zoom = z) {
  const k = compose(p), W = 112, H = 100, w = k.x1 - k.x0 + 1;
  sheet(W, H, zoom, (set) => {
    for (let x = 8; x < W - 8; x++) set(x, H - 5, C('sky.2'));
    for (const [x, y, c] of k.cells) set(((W - w) >> 1) + x - k.x0, H - 6 - k.lift - (k.y1 - y), c);
  }, label);
}

if (!show || show === 'founders') {
  section('The six founders');
  const all = names.map(n => [n, compose(founder(n))]);
  const TOP = 96, RH = 190;
  for (let from = 0; from < all.length; from += 3) {
    const pets = all.slice(from, from + 3);
    sheet(RW, RH, z, (set) => {
      const room = homeRoom('day', false, undefined, q.get('room') || undefined);
      for (let y = 0; y < room.back.h; y++) for (let x = 0; x < RW; x++) set(x, y - TOP, room.back.px[y * RW + x]);
      pets.forEach(([, k], i) => {
        const cx = Math.round((RW * (i + 0.5)) / pets.length), w = k.x1 - k.x0 + 1;
        for (const [x, y, c] of k.cells) set(cx - (w >> 1) + x - k.x0, HOME_FEET + 2 - TOP - k.lift - (k.y1 - y), c);
      });
    }, 'in a room');
  }
  for (const n of names) card(founder(n), n, z * 2);
}

if (!show || show === 'forms') {
  // each line's own parts on every body plan its body has been drawn for
  for (const n of names) {
    const base = founder(n), forms = FORMS.filter(f => drawable({ ...base, form: f }));
    if (forms.length < 2) continue;
    section(`${n}: its own parts in each body plan`);
    for (const f of forms) card({ ...base, form: f }, f + (f === base.form ? ' (its own)' : ''));
  }
}

if (!show || show === 'swaps') {
  // every drawn body under each other founder, in that founder's own body plan
  for (const [body, byForm] of Object.entries(PARTS.body)) {
    const others = names.filter(n => LINES[n].GENES.body !== body && byForm[LINES[n].FORM]);
    if (!others.length) continue;
    section(`the "${body}" body under the other founders`);
    for (const n of others) card({ ...founder(n), body }, `${n} (${LINES[n].FORM})`);
  }
}

if (!show || show === 'mixes') {
  section('Mixed children (random parts and colours from two founders, on bodies drawn so far)');
  const rng = makeRng(+(q.get('seed') || 1));
  const GENES = ['head', 'body', 'ears', 'tail', 'feet', 'wings', 'topper', 'hair', 'eyes', 'mouth', 'nose', 'mark', 'pattern'];
  let made = 0;
  for (let tries = 0; tries < 400 && made < 12; tries++) {
    const a = founder(rng.pick(names)), b = founder(rng.pick(names));
    if (a.head === b.head) continue;
    const p = { form: rng.chance(0.5) ? a.form : b.form };
    for (const g of GENES) p[g] = rng.chance(0.5) ? a[g] : b[g];
    const cfrom = rng.chance(0.5) ? a : b;
    Object.assign(p, { color: cfrom.color, deeper: cfrom.deeper, accent: (rng.chance(0.5) ? a : b).accent, eye: (rng.chance(0.5) ? a : b).eye });
    if (!drawable(p)) continue;
    card(p, `${p.head} head, ${p.body} body, ${p.form}`);
    made++;
  }
}
</script>
</body>
</html>
