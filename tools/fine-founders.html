<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fine-line founders</title>
<style>
  body { margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; background: #f4f1ea; color: #262459; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  figure { margin: 0 0 12px; text-align: center; }
  canvas { image-rendering: pixelated; border-radius: 6px; display: block; }
</style>
</head>
<body>
<p>Not in the game yet. The fine-line founders in <code>src/art/pets/fine/</code>, each put together from its parts on their sockets.
<code>?z=3</code> zoom, <code>?room=garden</code> room, <code>?only=caterpillar</code> one founder, <code>?color=mint</code> body colour.</p>
<div class="row" id="out"></div>
<script type="module">
import { PACKED, C, ramp } from '../src/engine/palette.js';
import { homeRoom, RW, HOME_FEET } from '../src/art/town.js';
import * as axolotl from '../src/art/pets/fine/axolotl.js';
import * as caterpillar from '../src/art/pets/fine/caterpillar.js';

const ALL = { axolotl, caterpillar };
const q = new URLSearchParams(location.search);
const z = +(q.get('z') || 3);
const out = document.getElementById('out');
const names = (q.get('only') || Object.keys(ALL).join(',')).split(',').filter(n => ALL[n]);
const SOCKETS = { '^': 'top', '[': 'earL', ']': 'earR', '@': 'face', '=': 'neck', '~': 'tail', '!': 'feet', '(': 'wingL', ')': 'wingR' };
const FIXED = { o: 'ink', w: 'white', l: 'green.2', L: 'green.1', j: 'green.0', P: 'pink.3', q: 'red.2' };

// read a part: note its sockets (painted as body colour)
function read(p) {
  if (!p) return null;
  const sockets = {};
  const rows = p.rows.map((r, y) => [...r].map((ch, x) => {
    if (!SOCKETS[ch]) return ch;
    (sockets[SOCKETS[ch]] ||= []).push([x, y]);
    return '4';
  }));
  return { ...p, rows, sockets, pivot: p.pivot || [0, 0] };
}

/** Put a founder together. Returns its pixels [x, y, colour] with the body's top-left at 0, 0, and their bounds. */
function compose(A) {
  const P = Object.fromEntries(['HEAD', 'EARS', 'TOPPER', 'BODY', 'TAIL', 'FEET', 'EYE', 'MOUTH', 'MARK', 'CHEEK'].map(n => [n, read(A[n])]));
  const color = q.get('color') || A.LOOK.color, accent = q.get('accent') || A.LOOK.accent;
  const col = { 4: ramp(color, 3), 3: ramp(color, 2), 2: ramp(color, 1), 8: ramp(accent, 3), 7: ramp(accent, 2), 6: ramp(accent, 1) };
  for (const [k, v] of Object.entries(FIXED)) col[k] = C(v);
  const px = new Map();
  const stamp = (p, ax, ay, flip = false, at = p && p.pivot) => p && p.rows.forEach((r, j) => r.forEach((ch, i) => {
    if (ch !== '.') px.set((flip ? ax + at[0] - i : ax - at[0] + i) + ',' + (ay - at[1] + j), col[ch]);
  }));
  const [bnx, bny] = P.BODY.sockets.neck[0], [hnx, hny] = P.HEAD.sockets.neck[0];
  const hx = bnx - hnx, hy = bny - hny; // the head's top-left: its neck on the body's
  const H = (n) => (P.HEAD.sockets[n] || []).map(([x, y]) => [hx + x, hy + y]);
  const B = (n) => (P.BODY.sockets[n] || []).map(([x, y]) => [x, y]);
  const [el] = H('earL'), [er] = H('earR'), [t] = B('tail'), [f] = H('face'), [top] = H('top');
  const ears = () => { stamp(P.EARS, el[0], el[1]); stamp(P.EARS, er[0], er[1], true); };
  if (!P.EARS.front) ears();
  if (t) stamp(P.TAIL, t[0], t[1]);
  stamp(P.BODY, 0, 0, false, [0, 0]);
  for (const [x, y] of B('feet')) stamp(P.FEET, x, y);
  stamp(P.HEAD, hx, hy, false, [0, 0]);
  if (P.EARS.front) ears();
  stamp(P.TOPPER, top[0], top[1]);
  const F = A.FACE;
  stamp(P.MARK, f[0] + F.mark[0], f[1] + F.mark[1]);
  stamp(P.CHEEK, f[0] - F.cheeks[0], f[1] + F.cheeks[1]); stamp(P.CHEEK, f[0] + F.cheeks[0], f[1] + F.cheeks[1]);
  stamp(P.EYE, f[0] - F.eyes, f[1]); stamp(P.EYE, f[0] + F.eyes, f[1]);
  stamp(P.MOUTH, f[0], f[1] + F.mouth);
  const cells = [...px].map(([k, c]) => [...k.split(',').map(Number), c]);
  const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
  return { cells, x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
}

function sheet(w, h, zoom, paint, label) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  cv.style.width = w * zoom + 'px'; cv.style.height = h * zoom + 'px';
  const ctx = cv.getContext('2d'), img = ctx.createImageData(w, h), u = new Uint32Array(img.data.buffer);
  u.fill(PACKED[C('sky.3')]);
  paint((x, y, c) => { if (c && x >= 0 && y >= 0 && x < w && y < h) u[y * w + x] = PACKED[c]; });
  ctx.putImageData(img, 0, 0);
  const f = document.createElement('figure'); f.append(cv, label); out.append(f);
}

const pets = names.map(n => [n, compose(ALL[n])]);

// together in a room, standing on the floor line
const TOP = 96, RH = 190;
sheet(RW, RH, z, (set) => {
  const room = homeRoom('day', false, undefined, q.get('room') || undefined);
  for (let y = 0; y < room.back.h; y++) for (let x = 0; x < RW; x++) set(x, y - TOP, room.back.px[y * RW + x]);
  pets.forEach(([, k], i) => {
    const cx = Math.round((RW * (i + 0.5)) / pets.length), w = k.x1 - k.x0 + 1;
    for (const [x, y, c] of k.cells) set(cx - (w >> 1) + x - k.x0, HOME_FEET + 2 - TOP - (k.y1 - y), c);
  });
}, 'in a room');

// each by itself, larger
for (const [n, k] of pets) {
  sheet(k.x1 - k.x0 + 9, k.y1 - k.y0 + 9, z * 2, (set) => { for (const [x, y, c] of k.cells) set(x - k.x0 + 4, y - k.y0 + 4, c); },
    `${n}: ${k.x1 - k.x0 + 1} x ${k.y1 - k.y0 + 1}`);
}
</script>
</body>
</html>
