<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fine-pixel pets: a mock-up</title>
<style>
  body { margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; background: #f4f1ea; color: #262459; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  figure { margin: 0; text-align: center; }
  canvas { image-rendering: pixelated; border-radius: 6px; display: block; }
</style>
</head>
<body>
<p>A mock-up, not in the game. In each room the pet on the left is today's (each of its pixels is a 2 × 2 block of the room's pixels)
and the one on the right is hand-drawn at the room's own pixel size. <code>?z=3</code> sets the zoom.</p>
<div class="row" id="out"></div>
<script type="module">
import { PACKED, C } from '../src/engine/palette.js';
import { makeRng } from '../src/engine/rng.js';
import { homeRoom, RW, HOME_FEET } from '../src/art/town.js';
import { composePet, CANVAS, GROUND } from '../src/game/render.js';
import { FOUNDERS, express, pureGenome } from '../src/game/genetics.js';
import { KEY, GLOOP, KITSU } from './fine-pets.js';

const z = +(new URLSearchParams(location.search).get('z') || 3);
const out = document.getElementById('out');
const TOP = 96, H = 190; // the slice of the room to show

for (const [name, rows] of [['Kitsu', KITSU], ['Gloop', GLOOP]]) {
  const cv = document.createElement('canvas'); cv.width = RW; cv.height = H;
  cv.style.width = RW * z + 'px'; cv.style.height = H * z + 'px';
  const ctx = cv.getContext('2d'), img = ctx.createImageData(RW, H), u = new Uint32Array(img.data.buffer);
  u.fill(PACKED[C('sky.3')]);
  const put = (x, y, c) => { y -= TOP; if (c && x >= 0 && y >= 0 && x < RW && y < H) u[y * RW + x] = PACKED[c]; };
  const room = homeRoom('day');
  for (let y = 0; y < room.back.h; y++) for (let x = 0; x < RW; x++) put(x, y, room.back.px[y * RW + x]);
  // today's pet, as the game draws it
  const p = express(pureGenome(FOUNDERS.find(f => f.name === name).traits), makeRng(1));
  const bm = composePet(p, 'adult', { gender: 'f' });
  const bx = 70 - CANVAS, by = HOME_FEET - GROUND * 2;
  for (let y = 0; y < bm.h; y++) for (let x = 0; x < bm.w; x++) put(bx + x, by + y, bm.px[y * bm.w + x]);
  // the fine one: its bottom row on the same floor line, over a soft shadow
  const w = rows[0].length, fx = 186 - (w >> 1), fy = HOME_FEET + 2 - rows.length;
  for (let i = -24; i <= 24; i++) { put(186 + i, HOME_FEET + 2, C('cream.1')); if (Math.abs(i) < 18) put(186 + i, HOME_FEET + 3, C('cream.1')); }
  rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch !== '.') put(fx + i, fy + j, C(KEY[ch])); }));
  ctx.putImageData(img, 0, 0);
  const f = document.createElement('figure');
  f.append(cv, `${name}: today's pixels (left), fine pixels (right)`);
  out.append(f);
}
</script>
</body>
</html>
