<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cuter pets: a mock-up</title>
<style>
  body { margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; background: #f4f1ea; color: #262459; }
  h2 { font-size: 14px; margin: 14px 0 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; }
  figure { margin: 0; text-align: center; font-size: 10px; width: 138px; }
  canvas { image-rendering: pixelated; background: #e9f6fb; border-radius: 8px; display: block; margin: 0 auto; }
  .sign { font-size: 22px; align-self: center; padding: 0 4px; }
</style>
</head>
<body>
<p>A mock-up, not in the game. Top: today's founders. Below: a simpler, rounder build (one chubby body, flat colour, a heavy outline,
a tiny face, a few bold features), still put together from genes. <code>?seed=4</code> changes the mixes.</p>
<div id="out"></div>
<script type="module">
import { HEX, PACKED, C } from '../src/engine/palette.js';
import { makeRng } from '../src/engine/rng.js';
import { composePet } from '../src/game/render.js';
import { FOUNDERS, express, pureGenome } from '../src/game/genetics.js';
import { BODIES, EARS, TOPS, TAILS, EYES, MOUTHS, MARKS } from './cute-pets.js';

const out = document.getElementById('out');
const W = 34, H = 34, Z = 4;

/** Put a pet together from its genes: { body, ears, top, tail, eyes, mouth, mark, color, accent }. */
function compose(g) {
  const px = new Array(W * H).fill(null);
  const col = { o: 'ink', w: 'white', p: 'pink.2', r: 'red.1', a: 'orange.2', L: 'green.1', l: 'green.2', Y: 'gold.3', y: 'gold.1',
    2: `${g.color}.1`, 3: `${g.color}.2`, 4: `${g.color}.3`, 6: `${g.accent}.2`, 7: `${g.accent}.3` };
  const body = BODIES[g.body], bx = 6, by = H - 1 - body.rows.length;
  const stamp = (rows, x, y, { flip = false, only = null } = {}) => rows.forEach((row, j) => [...row].forEach((ch, i) => {
    if (ch === '.') return;
    const X = x + (flip ? row.length - 1 - i : i), Y = y + j;
    if (X < 0 || Y < 0 || X >= W || Y >= H) return;
    if (only && !only.includes(px[Y * W + X])) return;
    px[Y * W + X] = col[ch];
  }));
  // behind the body: tail, ears, topper (the body's outline closes over their bases)
  if (TAILS[g.tail]) { const t = TAILS[g.tail]; stamp(t, bx + body.tail[0] - 1, by + body.tail[1] - (t.length >> 1)); }
  if (EARS[g.ears]) body.ears.forEach(([ex, ey], n) => { const e = EARS[g.ears]; stamp(e, bx + ex - (e[0].length >> 1), by + ey - e.length + 1, { flip: n === 1 }); });
  if (TOPS[g.top]) { const t = TOPS[g.top]; stamp(t, bx + body.top[0] - (t[0].length >> 1), by + body.top[1] - t.length + 1); }
  stamp(body.rows, bx, by);
  // markings recolour the body's own colour only, so they keep inside the outline
  const skin = [col[2], col[3], col[4]];
  const [fx, fy] = [bx + body.face[0], by + body.face[1]];
  if (MARKS[g.mark]) stamp(MARKS[g.mark].rows, fx + MARKS[g.mark].at[0], fy + MARKS[g.mark].at[1], { only: skin });
  // the face: two eyes set wide and low, a blush under each, a little mouth between
  const eye = EYES[g.eyes], ew = eye.rows[0].length, eh = eye.rows.length;
  stamp(eye.rows, fx - eye.gap - (ew >> 1), fy - (eh >> 1));
  stamp(eye.rows, fx + eye.gap - (ew >> 1) - (ew % 2 ? 0 : 1) + 1, fy - (eh >> 1));
  stamp(['pp'], fx - eye.gap - 3, fy + 2, { only: [...skin, col[6], col[7]] });
  stamp(['pp'], fx + eye.gap + 2, fy + 2, { only: [...skin, col[6], col[7]] });
  const m = MOUTHS[g.mouth];
  stamp(m, fx - (m[0].length >> 1), fy + 2);
  return px;
}

function show(row, px, label, w = W, h = H, z = Z) {
  const cv = document.createElement('canvas'); cv.width = w * z; cv.height = h * z;
  const ctx = cv.getContext('2d');
  px.forEach((c, i) => { if (c) { ctx.fillStyle = typeof c === 'string' ? HEX[C(c)] : c; ctx.fillRect((i % w) * z, Math.floor(i / w) * z, z, z); } });
  const f = document.createElement('figure'); f.append(cv, label); row.append(f);
}
function section(title) {
  const h = document.createElement('h2'); h.textContent = title; out.append(h);
  const r = document.createElement('div'); r.className = 'row'; out.append(r); return r;
}
const sign = (row, s) => row.append(Object.assign(document.createElement('div'), { className: 'sign', textContent: s }));
const label = (g) => `${g.body} · ${g.ears} · ${g.top}\n${g.eyes} · ${g.mark}`.replace('\n', ' · ');

// today's pets, as the game draws them (two fine pixels to one pet pixel, so shown at half zoom)
let r = section("Today's founders");
const rng0 = makeRng(1);
for (const f of FOUNDERS) {
  const bm = composePet(express(pureGenome(f.traits), rng0), 'adult', { gender: 'f' });
  const cv = document.createElement('canvas'); cv.width = bm.w; cv.height = bm.h; cv.style.width = bm.w * Z / 2 + 'px';
  const ctx = cv.getContext('2d'), img = ctx.createImageData(bm.w, bm.h), u = new Uint32Array(img.data.buffer);
  for (let i = 0; i < bm.px.length; i++) if (bm.px[i]) u[i] = PACKED[bm.px[i]];
  ctx.putImageData(img, 0, 0);
  const fig = document.createElement('figure'); fig.style.width = bm.w * Z / 2 + 'px'; fig.append(cv, f.name); r.append(fig);
}

// the same six ideas, rebuilt the simpler way
const SIX = [
  { name: 'fox', body: 'round', ears: 'cat', top: 'none', tail: 'curl', eyes: 'happy', mouth: 'cat', mark: 'belly', color: 'orange', accent: 'cream' },
  { name: 'jelly', body: 'drop', ears: 'none', top: 'sprout', tail: 'none', eyes: 'shine', mouth: 'open', mark: 'spots', color: 'mint', accent: 'cream' },
  { name: 'lamb', body: 'loaf', ears: 'horn', top: 'tuft', tail: 'puff', eyes: 'dot', mouth: 'smile', mark: 'mask', color: 'cream', accent: 'slate' },
  { name: 'jellyfish', body: 'drop', ears: 'none', top: 'star', tail: 'fin', eyes: 'tall', mouth: 'smile', mark: 'belly', color: 'sky', accent: 'pink' },
  { name: 'caterpillar', body: 'loaf', ears: 'bear', top: 'sprout', tail: 'none', eyes: 'shine', mouth: 'smile', mark: 'spots', color: 'lime', accent: 'gold' },
  { name: 'owl', body: 'round', ears: 'cat', top: 'none', tail: 'none', eyes: 'tall', mouth: 'beak', mark: 'mask', color: 'brown', accent: 'cream' },
];
r = section('The same six ideas, built the simpler way');
for (const g of SIX) show(r, compose(g), g.name);

// mixing: every gene comes from one parent or the other
const seed = +(new URLSearchParams(location.search).get('seed') || 4);
const rng = makeRng(seed);
const GENES = ['body', 'ears', 'top', 'tail', 'eyes', 'mouth', 'mark', 'color', 'accent'];
const mix = (a, b) => Object.fromEntries(GENES.map(k => [k, rng.chance(0.5) ? a[k] : b[k]]));
for (const [a, b] of [[SIX[0], SIX[3]], [SIX[2], SIX[1]], [SIX[5], SIX[4]]]) {
  r = section(`Mixing: ${a.name} with ${b.name}`);
  show(r, compose(a), a.name); sign(r, '+'); show(r, compose(b), b.name); sign(r, '=');
  for (let i = 0; i < 5; i++) { const kid = mix(a, b); show(r, compose(kid), label(kid)); }
}

// and a spread of wild ones, to see how far a small kit goes
r = section('Twelve at random from the same small kit');
const pick = (o) => rng.pick(Object.keys(o));
const RAMPS = ['pink', 'sky', 'mint', 'gold', 'violet', 'orange', 'cream', 'lime', 'red', 'blue'];
for (let i = 0; i < 12; i++) {
  const g = { body: pick(BODIES), ears: pick(EARS), top: pick(TOPS), tail: pick(TAILS), eyes: pick(EYES), mouth: pick(MOUTHS), mark: pick(MARKS), color: rng.pick(RAMPS), accent: rng.pick(['cream', 'pink', 'gold', 'slate', 'sky']) };
  show(r, compose(g), label(g));
}
</script>
</body>
</html>
