<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parts Sheet</title>
<style>
  body { margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; background: #f4f1ea; color: #262459; }
  h2 { font-size: 14px; margin: 14px 0 4px; }
  table { border-collapse: collapse; }
  td, th { padding: 3px 6px; vertical-align: bottom; text-align: center; font-size: 11px; }
  th { font-weight: 600; }
  canvas { image-rendering: pixelated; background: #e9f6fb; border-radius: 4px; }
  .owner { opacity: .6; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
// Every hand-drawn part, one row per allele and one column per form, in the
// colours of the founder that owns it. ?gene=ears shows one part; ?z=6 zooms.
import { PACKED } from '../src/engine/palette.js';
import { colors, lut } from '../src/engine/sprite.js';
import { FORMS, FORM_SECTIONS, EYES, MOUTHS, MARKS, NOSES } from '../src/art/pets/index.js';
import { GENES, FOUNDERS, lineOf } from '../src/game/genetics.js';

const params = new URLSearchParams(location.search);
const Z = +params.get('z') || 5;
const only = params.get('gene');
const out = document.getElementById('out');

function draw(p, ctx) {
  const s = p.spr, t = lut(s, ctx), f = s.frames[0];
  const c = document.createElement('canvas'); c.width = s.w + 2; c.height = s.h + 2;
  c.style.width = (s.w + 2) * Z + 'px'; c.style.height = (s.h + 2) * Z + 'px';
  const g = c.getContext('2d'); const img = g.createImageData(c.width, c.height); const u = new Uint32Array(img.data.buffer);
  for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w; x++) { const v = t[f[y * s.w + x]]; if (v) u[(y + 1) * c.width + x + 1] = PACKED[v]; }
  g.putImageData(img, 0, 0);
  return c;
}
const ctxFor = (gene, allele) => {
  const f = FOUNDERS.find(f => f.name === lineOf(gene, allele)) || FOUNDERS[0];
  const t = f.traits;
  return colors(t.color, t.accent, t.eyeColor, t.hairColor || t.color);
};
function table(title, rows, cols, cell) {
  const h = document.createElement('h2'); h.textContent = title; out.append(h);
  const tb = document.createElement('table');
  const head = document.createElement('tr'); head.innerHTML = '<th></th>' + cols.map(c => `<th>${c}</th>`).join('');
  tb.append(head);
  for (const r of rows) {
    const tr = document.createElement('tr');
    const th = document.createElement('th'); th.innerHTML = `${r}<br><span class="owner">${lineOf(title, r) || ''}</span>`; tr.append(th);
    for (const c of cols) { const td = document.createElement('td'); const el = cell(r, c); if (el) td.append(el); tr.append(td); }
    tb.append(tr);
  }
  out.append(tb);
}
// parts drawn per form
for (const [gene, section] of Object.entries(FORM_SECTIONS)) {
  if (only && only !== gene) continue;
  const alleles = Object.keys(GENES[gene]).filter(a => a !== 'none');
  table(gene, alleles, Object.keys(FORMS), (a, form) => { const p = FORMS[form][section]?.[a]; return p ? draw(p, ctxFor(gene, a)) : document.createTextNode('missing'); });
}
// shared face parts, two sizes
for (const [gene, set] of Object.entries({ eyes: EYES, mouth: MOUTHS, mark: MARKS, nose: NOSES })) {
  if (only && only !== gene) continue;
  table(gene, Object.keys(set), ['S', 'L'], (a, size) => draw(set[a][size], ctxFor(gene, a)));
}
// early stages and arms
if (!only || only === 'stages') {
  table('stages', ['baby', 'child'], Object.keys(FORMS), (st, form) => draw(FORMS[form][st], ctxFor('form', form)));
  table('arms', ['down', 'up', 'out'], Object.keys(FORMS), (k, form) => FORMS[form].arms?.[k] ? draw(FORMS[form].arms[k], ctxFor('form', form)) : null);
}
</script>
</body>
</html>
