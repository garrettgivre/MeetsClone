<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fine-line pets: the axolotl founder</title>
<style>
  body { margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; background: #f4f1ea; color: #262459; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  figure { margin: 0 0 12px; text-align: center; }
  canvas { image-rendering: pixelated; border-radius: 6px; display: block; }
</style>
</head>
<body>
<p>Not in the game yet. The fine-line parts in <code>src/art/pets/fine/axolotl.js</code>, put together on their sockets.
In the room: a double-pixel pet as the game draws it today (left) and the fine one (right). <code>?z=3</code> zoom, <code>?room=garden</code> room,
<code>?color=mint</code> body colour.</p>
<div class="row" id="out"></div>
<script type="module">
import { PACKED, C, ramp } from '../src/engine/palette.js';
import { makeRng } from '../src/engine/rng.js';
import { homeRoom, RW, HOME_FEET } from '../src/art/town.js';
import { composePet, CANVAS, GROUND } from '../src/game/render.js';
import { FOUNDERS, express, pureGenome } from '../src/game/genetics.js';
import * as A from '../src/art/pets/fine/axolotl.js';

const q = new URLSearchParams(location.search);
const z = +(q.get('z') || 3);
const out = document.getElementById('out');
const SOCKETS = { '^': 'top', '[': 'earL', ']': 'earR', '@': 'face', '=': 'neck', '~': 'tail', '!': 'feet', '(': 'wingL', ')': 'wingR' };

// read a part: note its sockets, paint them as body colour
function read(p) {
  const sockets = {};
  const rows = p.rows.map((r, y) => [...r].map((ch, x) => {
    if (!SOCKETS[ch]) return ch;
    (sockets[SOCKETS[ch]] ||= []).push([x, y]);
    return '4';
  }));
  return { rows, sockets, pivot: p.pivot || [0, 0] };
}
const P = Object.fromEntries(['HEAD', 'GILLS', 'BODY', 'TAIL', 'FEET', 'EYE', 'MOUTH', 'MARK', 'CHEEK'].map(n => [n, read(A[n])]));

/** Put the pet together with the body's top-left at (ox, oy). put(x, y, colour). */
function fine(put, ox, oy, color = 'pink', accent = 'red') {
  const col = { o: C('ink'), w: C('white'), 4: ramp(color, 3), 3: ramp(color, 2), 2: ramp(color, 1), 8: ramp(accent, 3) };
  const stamp = (p, ax, ay, flip = false) => p.rows.forEach((r, j) => r.forEach((ch, i) => {
    if (ch !== '.') put(flip ? ax + p.pivot[0] - i : ax - p.pivot[0] + i, ay - p.pivot[1] + j, col[ch]);
  }));
  const [bnx, bny] = P.BODY.sockets.neck[0], [hnx, hny] = P.HEAD.sockets.neck[0];
  const hx = ox + bnx - hnx, hy = oy + bny - hny; // the head's top-left: its neck on the body's
  const H = (n) => P.HEAD.sockets[n].map(([x, y]) => [hx + x, hy + y]);
  const B = (n) => P.BODY.sockets[n].map(([x, y]) => [ox + x, oy + y]);
  const [el] = H('earL'), [er] = H('earR'), [t] = B('tail'), [f] = H('face');
  stamp(P.GILLS, el[0], el[1]); stamp(P.GILLS, er[0], er[1], true);
  stamp(P.TAIL, t[0], t[1]);
  stamp({ ...P.BODY, pivot: [0, 0] }, ox, oy);
  for (const [x, y] of B('feet')) stamp(P.FEET, x, y);
  stamp({ ...P.HEAD, pivot: [0, 0] }, hx, hy);
  const F = A.FACE;
  stamp(P.MARK, f[0] + F.mark[0], f[1] + F.mark[1]);
  stamp(P.CHEEK, f[0] - F.cheeks[0], f[1] + F.cheeks[1]); stamp(P.CHEEK, f[0] + F.cheeks[0], f[1] + F.cheeks[1]);
  stamp(P.EYE, f[0] - F.eyes, f[1]); stamp(P.EYE, f[0] + F.eyes, f[1]);
  stamp(P.MOUTH, f[0], f[1] + F.mouth);
}
// the pet's own box: head above the body, gills and tail either side
const LEFT = 28, UP = 44, FW = 104, FH = 72, BODY_H = P.BODY.rows.length;

function sheet(w, h, zoom, paint, label) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  cv.style.width = w * zoom + 'px'; cv.style.height = h * zoom + 'px';
  const ctx = cv.getContext('2d'), img = ctx.createImageData(w, h), u = new Uint32Array(img.data.buffer);
  u.fill(PACKED[C('sky.3')]);
  paint((x, y, c) => { if (c && x >= 0 && y >= 0 && x < w && y < h) u[y * w + x] = PACKED[c]; });
  ctx.putImageData(img, 0, 0);
  const f = document.createElement('figure'); f.append(cv, label); out.append(f);
}

const TOP = 96, RH = 190;
sheet(RW, RH, z, (set) => {
  const put = (x, y, c) => set(x, y - TOP, c);
  const room = homeRoom('day', false, undefined, q.get('room') || undefined);
  for (let y = 0; y < room.back.h; y++) for (let x = 0; x < RW; x++) put(x, y, room.back.px[y * RW + x]);
  // (the double-pixel axolotl is on the branch wip/axolotl-coarse; on main the old founder stands in)
  const p = express(pureGenome((FOUNDERS.find(f => f.name === 'Lotl') || FOUNDERS[2]).traits), makeRng(1));
  const bm = composePet(p, 'adult', { gender: 'f' });
  const bx = 66 - CANVAS, by = HOME_FEET - GROUND * 2;
  for (let y = 0; y < bm.h; y++) for (let x = 0; x < bm.w; x++) put(bx + x, by + y, bm.px[y * bm.w + x]);
  fine(put, 160, HOME_FEET + 2 - BODY_H, q.get('color') || 'pink', q.get('accent') || 'red');
}, "today's pixels (left), fine line (right)");

sheet(FW, FH, z * 2, (set) => fine(set, LEFT, UP, q.get('color') || 'pink', q.get('accent') || 'red'), 'the fine one, enlarged');
</script>
</body>
</html>
