<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Gallery</title>
<style>
  body { margin: 0; padding: 16px; font: 14px system-ui, sans-serif; background: #f4f1ea; color: #1b1528; }
  h2 { font-size: 15px; margin: 18px 0 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  canvas { image-rendering: pixelated; width: 240px; height: 240px; background: #fbf8ff; border-radius: 8px; }
  figure { margin: 0; text-align: center; font-size: 11px; }
  button { font: inherit; padding: 6px 12px; }
  .compact canvas { width: 180px; height: 180px; }
</style>
</head>
<body>
<button id="reroll">New random pets</button>
<div id="out"></div>
<script type="module">
import { PACKED } from '../src/engine/palette.js';
import { composePet, composeEgg, composeGhost, CANVAS } from '../src/game/render.js';
import { FOUNDERS, pureGenome, express, randomGenome, inherit, STARTER, GENES } from '../src/game/genetics.js';

const out = document.getElementById('out');
function show(bm, label, parent) {
  const c = document.createElement('canvas');
  c.width = c.height = CANVAS * 2; // pets are double density
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(c.width, c.height);
  const u = new Uint32Array(img.data.buffer);
  for (let i = 0; i < bm.px.length; i++) u[i] = bm.px[i] ? PACKED[bm.px[i]] : 0;
  ctx.putImageData(img, 0, 0);
  const f = document.createElement('figure');
  f.append(c, document.createElement('br'), label);
  parent.append(f);
}
function section(title) {
  const h = document.createElement('h2'); h.textContent = title; out.append(h);
  const r = document.createElement('div'); r.className = 'row'; out.append(r); return r;
}
function render() {
  out.innerHTML = '';
  const only = new URLSearchParams(location.search).get('gene');
  let r;
  if (only) { document.body.classList.add('compact'); return parts(only.split(',')); }
  r = section('Founders (generation 1 adults)');
  const founders = FOUNDERS.map(f => ({ ...f, p: express(pureGenome(f.traits)) }));
  founders.forEach((f, i) => show(composePet(f.p, 'adult', { gender: i % 2 ? 'm' : 'f' }), f.name, r));
  r = section('Growth: egg, baby, child, teen, adult');
  const p = express(randomGenome());
  show(composeEgg(p, 0), 'egg', r);
  for (const s of ['baby', 'child', 'teen', 'adult']) show(composePet(p, s, { gender: 'f' }), s, r);
  r = section('Expressions');
  for (const e of ['idle', 'blink', 'happy', 'sad', 'eat', 'chew', 'sleep', 'dizzy']) show(composePet(p, 'adult', { expr: e }), e, r);
  show(composeGhost(), 'ghost', r);
  r = section('Poses');
  for (const [label, pose] of [['arms up', { arms: 'up', expr: 'happy' }], ['wave', { arms: 'wave', expr: 'wink' }], ['arms out', { arms: 'out' }], ['step 1', { step: 1 }], ['step 2', { step: 2 }]])
    show(composePet(p, 'adult', { gender: 'f', ...pose }), label, r);
  show(composePet(express(STARTER ? pureGenome(STARTER) : p), 'child'), 'starter', r);
  parts(['form', 'head', 'body', 'ears', 'pattern', 'tail', 'topper', 'feet', 'wings', 'hair', 'eyes', 'mouth', 'mark', 'nose']);
  r = section('Random adults');
  for (let i = 0; i < 16; i++) show(composePet(express(randomGenome()), 'adult', { gender: i % 2 ? 'm' : 'f' }), '#' + (i + 1), r);
  r = section(`Family: ${FOUNDERS[0].name} x ${FOUNDERS[5].name} children`);
  const mom = pureGenome(FOUNDERS[0].traits), dad = pureGenome(FOUNDERS[5].traits);
  for (let i = 0; i < 12; i++) show(composePet(express(inherit(mom, dad)), 'adult'), 'child ' + (i + 1), r);
}
// every option of a gene on one plain base pet (?gene=shape shows just one)
function parts(genes) {
  // a plain base pet in each form; ?form=quad picks the form
  const base = express(pureGenome({ ...STARTER, form: new URLSearchParams(location.search).get('form') || 'biped', color: 'orange', accent: 'cream' }));
  for (const gene of genes) {
    const r = section('Parts: ' + gene);
    for (const v of Object.keys(GENES[gene])) show(composePet({ ...base, [gene]: v, hairColor: 'brown' }, 'adult', { gender: 'm' }), v, r);
  }
}
document.getElementById('reroll').onclick = render;
render();
</script>
</body>
</html>
