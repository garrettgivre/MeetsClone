<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#262459">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>MeetsClone</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="device">
  <div id="bezel">
    <canvas id="screen" aria-label="Game screen"></canvas>
  </div>
  <div id="glass" aria-hidden="true"></div>
  <div id="controls">
    <div id="buttons">
      <button class="btn" data-btn="A" aria-label="A: next"><span></span></button>
      <button class="btn" data-btn="B" aria-label="B: select"><span></span></button>
      <button class="btn" data-btn="C" aria-label="C: back"><span></span></button>
    </div>
  </div>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
